[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loreraven"
version = "0.1.0"
description = "Clone a GitHub repo, embed it into Postgres (pgvector), and ask an AI about it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"langchain>=1.3.17",
	"langchain-openai>=1.6.0",
	"langchain-text-splitters>=1.1.2",
	"langchain-postgres>=0.0.17",
	"asyncpg>=0.31.0",
	"gitpython>=3.1.60",
	"python-dotenv>=1.2.3",
	"fastapi>=0.120.0",
	"uvicorn[standard]>=0.38.0",
]

[project.scripts]
loreraven = "loreraven.cli.main:main"

[project.optional-dependencies]
dev = [
	"pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loreraven*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
	"integration: needs a live pgvector database (set LORERAVEN_TEST_DATABASE_URL)",
]
